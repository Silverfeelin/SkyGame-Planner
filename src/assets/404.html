<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 Not Found</title>
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      background: oklch(0.18 0.02 240);
      color: oklch(0.97 0.005 240);
      font-family: 'Roboto', system-ui, sans-serif;
      text-align: center;
    }
    main {
      max-width: 420px;
      padding: 32px;
      border-radius: 24px;
      background: oklch(0.235 0.028 240);
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 24px; color: oklch(0.78 0.015 240); }
    a {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 999px;
      background: oklch(0.82 0.11 240);
      color: oklch(0.18 0.02 240);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>404 Not Found</h1>
    <p>The requested file does not exist.</p>
    <a href="/">Back to Sky Planner</a>
  </main>
</body>
</html>
