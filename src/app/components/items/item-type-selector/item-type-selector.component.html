<div class="type-list">
  <!-- Outfits -->
  <div class="item-icon category" *ngIf="_showTypes['Outfit']" [class.highlight]="type === 'Outfit'"
  [skyTooltip]="'Outfits'"
    (click)="changeType('Outfit')">
    <mat-icon svgIcon="outfit"></mat-icon>
  </div>
  <!-- Shoes -->
  <div class="item-icon category" *ngIf="_showTypes['Shoes']" [class.highlight]="type === 'Shoes'"
  [skyTooltip]="'Shoes'"
    (click)="changeType('Shoes')">
    <mat-icon svgIcon="shoes"></mat-icon>
  </div>
  <!-- Outfit Shoes -->
  <div class="item-icon category" *ngIf="_showTypes['OutfitShoes']" [class.highlight]="type === 'OutfitShoes'"
  [skyTooltip]="'Outfits with shoes'"
    (click)="changeType('OutfitShoes')">
    <mat-icon svgIcon="outfit-shoes"></mat-icon>
  </div>
