<p class="atmos-item-unlock-calc-sub__hint">Search for a spirit to add the main items from its spirit tree.</p>
<label class="atmos-item-unlock-calc-sub__search atmos-focus-ring">
  <mat-icon>search</mat-icon>
  <input #input type="search" (input)="search()" placeholder="Spirit name" aria-label="Spirit name">
</label>

@if (results() && results()!.length === 0) {
  <p class="atmos-item-unlock-calc-sub__hint">No spirits found by that name.</p>
} @else if (results()) {
  <div class="atmos-item-unlock-calc-sub__cards">
    @for (result of results(); track result.data.guid) {
      <app-spirit-card [spirit]="result.data" [options]="{show: ['img', 'select']}"
        (spiritSelected)="onSpiritSelected($event)">
      </app-spirit-card>
    }
  </div>
}
