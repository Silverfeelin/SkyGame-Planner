@if (items.length) {
  <div class="atmos-item-unlock-calc-sub__bar">
    <p class="atmos-item-unlock-calc-sub__hint">Wishlist items you don't own yet. Click one to add it.</p>
    <button type="button" class="atmos-btn atmos-btn--sm" (click)="addAll($event)">
      <mat-icon>playlist_add</mat-icon> Add all {{ items.length }}
    </button>
  </div>
  <div class="atmos-item-unlock-calc-sub__grid">
    @for (item of items; track item.guid) {
      <div class="atmos-item-unlock-calc-sub__icon"
        [skyTooltip]="item.name"
        (click)="onItemSelected($event, item)">
        <app-item-icon [item]="item" [opaque]="true" [subIcons]="SUBICONS_ALL"></app-item-icon>
      </div>
    }
  </div>
} @else {
  <p class="atmos-item-unlock-calc-sub__hint">Your wishlist is empty, or you already own everything on it.</p>
}
