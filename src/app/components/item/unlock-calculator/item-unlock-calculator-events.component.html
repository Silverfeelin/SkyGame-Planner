<p class="atmos-item-unlock-calc-sub__hint">Add the items from the most recent edition of an event.</p>
<div class="atmos-item-unlock-calc-sub__buttons">
  @for (event of events; track event.guid) {
    <button type="button" class="atmos-btn atmos-btn--sm" (click)="onEventSelected(event)">
      {{ event.name }}
    </button>
  }
</div>
