<app-section-quick-actions section="item" />

@if (showTipUnlock()) {
  <p class="atmos-paragraph atmos-page__hint">
    Tip: Did you mean to {{ item()?.unlocked ? 'lock' : 'unlock' }} the item?
    Go <a (click)="goBack()" class="atmos-text-link">back</a> and click on the price below the item!
  </p>
}

@if (item(); as itm) {
  <header class="atmos-page__header">
    <h1 class="atmos-page__title">{{ itm.name }}</h1>
  </header>

  <app-item-summary [item]="itm" />

  @if (itm.dye) {
    <app-item-dye-versions [item]="itm" />
  }
} @else {
  <section class="atmos-card">
    <div class="atmos-card__body">
      Item not found. <a class="atmos-text-link" [routerLink]="['/item/grid']">Back to grid</a>
    </div>
  </section>
}
