<svg viewBox="0 0 168 72" aria-hidden="true" focusable="false">
  <rect class="sk-scene" width="168" height="72"/>
  <rect class="sk-panel" [attr.x]="panelX" y="0" [attr.width]="panelW" height="72"/>
  @for (t of categoryTabs; track t.k) {
    <rect class="sk-cat" [class.is-lit]="kind() === 'tab' && t.k === highlight()" [attr.x]="t.x" y="4" width="12" height="8" rx="2"/>
  }
  <line class="sk-line" [attr.x1]="panelX + 3" y1="15" [attr.x2]="panelX + panelW - 3" y2="15"/>
  <svg [attr.x]="panelX" y="0" [attr.width]="panelW" height="72" overflow="hidden">
    <g [attr.transform]="panelShift">
      @for (tile of tiles(); track $index) {
        <rect [attr.class]="tile.cut ? 'sk-tile is-cut' : 'sk-tile tone-' + tile.tone"
              [attr.x]="tile.x" [attr.y]="tile.y" width="12" [attr.height]="tile.height" rx="3"/>
      }
    </g>
  </svg>
  @if (kind() === 'scroll') {
    <path class="sk-mark" d="M60 58 V26 M54 32 L60 26 L66 32"/>
  }
  @if (kind() === 'whole') {
    <rect class="sk-mark sk-frame" x="2" y="2" width="164" height="68" rx="6"/>
  }
</svg>
