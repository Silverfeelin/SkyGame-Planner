<app-section-quick-actions section="event" />

<header class="atmos-page__header">
  <h1 class="atmos-page__title">{{ 'EVENTS_PAGE.TITLE' | translate }}</h1>
</header>

<p class="atmos-paragraph atmos-events__intro">
  {{ 'EVENTS_PAGE.INTRO' | translate }}
</p>

<section class="atmos-events__section">
  <header class="atmos-events__section-header">
    <h2 class="atmos-section__title atmos-section__title--lg">{{ 'EVENTS_PAGE.RECURRING' | translate }}</h2>
  </header>
  <div class="atmos-events__grid">
    @for (row of recurring(); track row.event.guid) {
      <app-event-card
        [event]="row.event"
        [instance]="row.instance"
        [options]="{ show: ['img', 'date', 'list'] }"></app-event-card>
    }
  </div>
</section>

<section class="atmos-events__section">
  <header class="atmos-events__section-header">
    <h2 class="atmos-section__title atmos-section__title--lg">{{ 'EVENTS_PAGE.OTHER' | translate }}</h2>
  </header>
  <div class="atmos-events__grid">
    @for (row of old(); track row.event.guid) {
      <app-event-card
        [event]="row.event"
        [instance]="row.instance"
        [options]="{ show: ['img', 'date', 'list'] }"></app-event-card>
    }
  </div>
</section>
