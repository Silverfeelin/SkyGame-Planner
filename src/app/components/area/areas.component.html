<app-section-quick-actions section="realm" />

<header class="atmos-page__header">
  <h1 class="atmos-page__title">{{ 'AREAS_PAGE.TITLE' | translate }}</h1>
</header>

<section class="atmos-areas__grid">
  @for (area of areas; track area.guid) {
    <app-feature-card
      [title]="area.name"
      [titleLink]="'/area/' + area.guid"
      [bannerUrl]="area.imageUrl"
      [bannerPosition]="area.imagePosition"
      [links]="areaLinks(area)" />
  }
</section>
