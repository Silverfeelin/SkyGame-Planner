<nav class="atmos-sidebar" aria-label="Primary">
  <div class="atmos-sidebar__group">
    <button
      class="atmos-nav-item atmos-nav-item--toggle"
      type="button"
      (click)="toggleCollapsed()"
      [attr.aria-expanded]="!collapsed()"
      [attr.aria-label]="(collapsed() ? 'NAV.EXPAND_MENU' : 'NAV.COLLAPSE_MENU') | translate"
      [skyTooltip]="collapsed() ? ('NAV.EXPAND_MENU' | translate) : ''">
      <mat-icon>{{ collapsed() ? 'menu' : 'menu_open' }}</mat-icon>
      <span class="atmos-nav-item__label">{{ 'NAV.COLLAPSE_MENU' | translate }}</span>
    </button>
    <button
      class="atmos-nav-item atmos-nav-item--back"
      type="button"
      (click)="goBack()"
      [skyTooltip]="collapsed() ? ('NAV.BACK' | translate) : ''">
      <mat-icon>arrow_back</mat-icon>
      <span class="atmos-nav-item__label">{{ 'NAV.BACK' | translate }}</span>
    </button>
    <app-nav-tree [mode]="collapsed() ? 'rail' : 'full'" />
  </div>

  <div class="atmos-sidebar__spacer"></div>

  <div class="atmos-sidebar__group atmos-sidebar__group--foot">
    @for (item of nav.footer; track item.id) {
      @if (item.external) {
        <a
          class="atmos-nav-item atmos-nav-item--small"
          [href]="item.link"
          target="_blank"
          rel="noopener"
          [skyTooltip]="collapsed() ? item.label : ''">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span class="atmos-nav-item__label">{{ item.label | translate }}</span>
        </a>
      } @else {
        <a
          class="atmos-nav-item atmos-nav-item--small"
          [routerLink]="item.link"
          routerLinkActive="is-active"
          [skyTooltip]="collapsed() ? item.label : ''">
          <mat-icon>{{ item.icon }}</mat-icon>
          <span class="atmos-nav-item__label">{{ item.label | translate }}</span>
        </a>
      }
    }
  </div>
</nav>
