<app-section-quick-actions section="realm" />

<header class="atmos-page__header">
  <h1 class="atmos-page__title">{{ 'REALMS_PAGE.TITLE' | translate }}</h1>
  <button type="button" class="atmos-btn atmos-btn--sm"
    (click)="toggleShowMap()">
    <mat-icon>map</mat-icon>
    <span>{{ showMap() ? ('REALMS_PAGE.HIDE_MAP' | translate) : ('REALMS_PAGE.SHOW_MAP' | translate) }}</span>
  </button>
</header>

<section class="atmos-card atmos-realms__map" [class.is-hidden]="!showMap()">
  <div class="atmos-realms__map-container" #mapContainer>
    <div class="atmos-realms__map-controls">
      <button type="button"
        class="atmos-btn atmos-btn--sm"
        [class.atmos-btn--active]="showAreas()"
        [skyTooltip]="'REALMS_PAGE.SHOW_AREAS' | translate" placement="bottom-start"
        (click)="toggleShowAreas()">
        <mat-icon>location_on</mat-icon>
      </button>
      <button type="button"
        class="atmos-btn atmos-btn--sm"
        [class.atmos-btn--active]="showMapShrines()"
        [skyTooltip]="'REALMS_PAGE.SHOW_MAP_SHRINES' | translate" placement="bottom-start"
        (click)="toggleShowMapShrines()">
        <mat-icon svgIcon="map-shrine"></mat-icon>
      </button>
      <button type="button"
        class="atmos-btn atmos-btn--sm"
        [class.atmos-btn--active]="showWingedLight()"
        [skyTooltip]="'REALMS_PAGE.SHOW_WINGED_LIGHT' | translate" placement="bottom-start"
        (click)="toggleShowWingedLight()">
        <mat-icon svgIcon="flaps"></mat-icon>
      </button>
    </div>
    <div class="map"></div>
  </div>
</section>

<section class="atmos-realms__grid">
  @for (realm of visibleRealms; track realm.guid) {
    <app-feature-card
      [title]="realm.name"
      [titleLink]="'/realm/' + realm.guid"
      [bannerUrl]="realm.imageUrl"
      [bannerPosition]="realm.imagePosition"
      [links]="realmLinks.get(realm.guid) ?? []"
      />
  }
</section>
