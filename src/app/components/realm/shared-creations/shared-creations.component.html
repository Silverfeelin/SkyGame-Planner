<app-section-quick-actions section="realm" />

<header class="atmos-page__header">
  <h1 class="atmos-page__title">{{ 'SHARED_CREATIONS.TITLE' | translate }}</h1>
</header>

<div class="atmos-page__intro">
  <p class="atmos-paragraph">
    {{ 'SHARED_CREATIONS.INTRO' | translate }}
  </p>
</div>

<section class="atmos-card atmos-shared-creations__map-card">
  <div class="atmos-shared-creations__map-container" #mapContainer>
    <div class="atmos-shared-creations__controls">
      <button type="button"
        class="atmos-btn atmos-btn--sm"
        [class.atmos-btn--active]="placementType() === 'message'"
        [skyTooltip]="'SHARED_CREATIONS.PLACE_MESSAGE' | translate" placement="bottom-start"
        (click)="togglePlacement('message')">
        <mat-icon [svgIcon]="iconIds['message']"></mat-icon>
      </button>
      <button type="button"
        class="atmos-btn atmos-btn--sm"
        [class.atmos-btn--active]="placementType() === 'memory'"
        [skyTooltip]="'SHARED_CREATIONS.PLACE_MEMORY' | translate" placement="bottom-start"
        (click)="togglePlacement('memory')">
        <mat-icon [svgIcon]="iconIds['memory']"></mat-icon>
      </button>
      <button type="button"
        class="atmos-btn atmos-btn--sm"
        [class.atmos-btn--active]="placementType() === 'space'"
        [skyTooltip]="'SHARED_CREATIONS.PLACE_SPACE' | translate" placement="bottom-start"
        (click)="togglePlacement('space')">
        <mat-icon [svgIcon]="iconIds['space']"></mat-icon>
      </button>
    </div>
    <div class="map" [class.is-placement-armed]="placementType()"></div>
  </div>
</section>
