<app-section-quick-actions section="wingedLight" />

<header class="atmos-page__header">
  <h1 class="atmos-page__title">{{ 'COL_PAGE.TITLE' | translate }}</h1>
  <div class="atmos-col__count" aria-live="polite">
    <strong [class.atmos-col__count-complete]="unlockedCol === totalCol && totalCol > 0">{{ unlockedCol }}</strong>
    <span class="atmos-col__count-sep"> / {{ totalCol }}</span>
    <span class="atmos-col__count-label"> {{ 'COL_PAGE.FOUND_LABEL' | translate }}</span>
  </div>
</header>

<app-quick-actions>
  <button type="button" class="atmos-btn atmos-btn--sm" (click)="unlockAll()">
    <mat-icon>done_all</mat-icon>
    <span>{{ 'COL_PAGE.MARK_ALL_FOUND' | translate }}</span>
  </button>
  <div class="atmos-btn-group">
    <button type="button" class="atmos-btn atmos-btn--sm atmos-btn--danger" (click)="reset()">
      <mat-icon>restart_alt</mat-icon>
      <span>{{ 'COL_PAGE.RESET' | translate }}</span>
    </button>
    <button type="button" class="atmos-btn atmos-btn--sm atmos-btn--danger" (click)="resetOrbit()">
      <mat-icon>flight_takeoff</mat-icon>
      <span>{{ 'COL_PAGE.LEFT_ORBIT' | translate }}</span>
    </button>
  </div>
</app-quick-actions>

<div class="atmos-card atmos-col__map-card" #mapContainer>
  <button type="button" class="atmos-col__map-control" (click)="scrollToList()" [skyTooltip]="'COL_PAGE.SCROLL_TO_LIST' | translate" [attr.aria-label]="'COL_PAGE.SCROLL_TO_LIST' | translate">
    <mat-icon>arrow_downward</mat-icon>
  </button>
  <div class="atmos-col__map"></div>
</div>

<div #table class="atmos-card atmos-col__grid-card">
  <ag-grid-angular
    [rowData]="rowData"
    [columnDefs]="colDefs"
    [theme]="theme"
    [domLayout]="'autoHeight'"
    [suppressDragLeaveHidesColumns]="true"
    (gridReady)="onGridReady($event)"/>
</div>
