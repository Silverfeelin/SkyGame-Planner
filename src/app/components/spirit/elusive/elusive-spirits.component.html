<app-section-quick-actions section="spirit" />

<header class="atmos-page__header">
  <h1 class="atmos-page__title">{{ 'SPIRITS_PAGE.ELUSIVE_TITLE' | translate }}</h1>
</header>

<div class="atmos-page__intro">
  <p class="atmos-paragraph atmos-page__hint" [innerHTML]="'SPIRITS_PAGE.ELUSIVE_HINT_1' | translate"></p>
  <p class="atmos-paragraph atmos-page__hint" [innerHTML]="'SPIRITS_PAGE.ELUSIVE_HINT_2' | translate"></p>
</div>

<div class="atmos-card atmos-elusive__grid-card">
  <ag-grid-angular gridFilterShortcut="spirit"
    [rowData]="rowData"
    [columnDefs]="colDefs"
    [theme]="theme"
    [getRowHeight]="getRowHeight"
    [suppressDragLeaveHidesColumns]="true"
    (gridReady)="onGridReady($event)" />
</div>
