<div class="atmos-toolbar" data-step="100" data-position="bottom-left-aligned">
  <div class="atmos-toolbar__row atmos-toolbar__row--actions">
    @if (!isRequesting()) {
      <!-- Show my/all items -->
      <button type="button" class="atmos-btn atmos-btn--sm" (click)="toggleCloset()" data-step="101">
        <mat-icon>checkroom</mat-icon>
        <span>{{ state.closetMode() === 'all' ? 'My items' : 'All items' }}</span>
      </button>
      <!-- Modify closet -->
      <button type="button" class="atmos-btn atmos-btn--sm" [class.atmos-btn--active]="state.modifyingCloset()" (click)="modifyCloset()" data-step="102" data-position="bottom-left-aligned">
        <mat-icon>manufacturing</mat-icon>
        <span>Modify</span>
      </button>
    }
    <!-- Icon size -->
    <button type="button" class="atmos-btn atmos-btn--sm" (click)="toggleItemSize()" data-step="122" data-position="bottom-left-aligned">
      <mat-icon>{{ state.itemSize() === 'small' ? 'zoom_in' : 'zoom_out' }}</mat-icon>
      <span>{{ state.itemSize() === 'small' ? 'Large icons' : 'Small icons' }}</span>
    </button>
    @if (!isRequesting()) {
      <!-- IAP toggle -->
      <button type="button" class="atmos-btn atmos-btn--sm" (click)="toggleIap()" data-step="123" data-position="bottom-left-aligned">
        <mat-icon>{{ state.hideIap() ? 'attach_money' : 'money_off' }}</mat-icon>
        <span>{{ state.hideIap() ? 'Show IAP' : 'Hide IAP' }}</span>
      </button>
    }
    <!-- Background -->
    <button type="button" class="atmos-btn atmos-btn--sm" [class.atmos-btn--active]="state.showingBackgroundPicker()" (click)="showBackgroundPicker($event)" data-step="128" data-position="bottom-left-aligned">
      <mat-icon>wallpaper</mat-icon>
      <span>Background</span>
    </button>
    <div class="atmos-btn-group">
      <button type="button" class="atmos-btn atmos-btn--sm atmos-btn--danger" (click)="resetRequest.emit()" data-step="124" data-position="bottom-left-aligned">
        <mat-icon>delete_forever</mat-icon>
        <span>Reset</span>
      </button>
      <button type="button" class="atmos-btn atmos-btn--sm atmos-btn--danger" (click)="randomRequest.emit()" aria-label="Shuffle" data-step="125" data-position="bottom-left-aligned">
        <mat-icon>shuffle</mat-icon>
      </button>
    </div>
    @if (!isRequesting()) {
      <!-- Highlight items from a one-fit image -->
      <button type="button" class="atmos-btn atmos-btn--sm" (click)="imageInput.click()"
        [title]="'Highlight the items of a one-fit image. You can also paste (' + pasteKey + ') or drop the image on this page.'">
        <mat-icon>image_search</mat-icon>
        <span>From image</span>
      </button>
      <input #imageInput type="file" hidden [accept]="imageAccept" (change)="pickImage(imageInput)" />
    }
    <!-- Color picker -->
    <div class="atmos-color-picker" data-step="3" data-position="bottom-right-aligned">
      <button type="button" class="atmos-btn atmos-btn--sm"
        [class.atmos-btn--active]="state.showingColorPicker()"
        [attr.aria-expanded]="state.showingColorPicker()" aria-haspopup="menu"
        (click)="toggleColorPicker($event)">
        @if (state.color(); as color) {
          <span [class]="'atmos-color-swatch atmos-color-swatch--' + color" aria-hidden="true"></span>
        } @else {
          <mat-icon>ink_eraser</mat-icon>
        }
        <span>{{ colorLabel() }}</span>
      </button>
      @if (state.showingColorPicker()) {
        <div class="atmos-color-picker__dropdown" role="menu">
          @for (option of colors; track option.color) {
            <button type="button" role="menuitemradio" class="atmos-color-picker__option"
              [class.atmos-color-picker__option--active]="state.color() === option.color"
              [attr.aria-checked]="state.color() === option.color"
              [attr.aria-label]="option.label" [title]="option.label"
              (click)="setColor(option.color)">
              <span [class]="'atmos-color-swatch atmos-color-swatch--' + option.color"></span>
            </button>
          }
          <button type="button" role="menuitemradio" class="atmos-color-picker__option"
            [class.atmos-color-picker__option--active]="!state.color()"
            [attr.aria-checked]="!state.color()"
            aria-label="Eraser" title="Eraser"
            (click)="setColor(undefined)">
            <mat-icon>ink_eraser</mat-icon>
          </button>
        </div>
      }
    </div>
  </div>
</div>
