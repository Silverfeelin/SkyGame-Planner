<app-section-quick-actions section="tool" />

<header class="atmos-page__header">
  <h1 class="atmos-page__title">Collage</h1>
</header>

<div class="atmos-collage">

  <!-- Size picker -->
  <div class="atmos-collage__size">
    <span class="atmos-collage__size-label">
      Choose the size of your collage.
      <span class="atmos-collage__size-value">{{ displaySize().x }} × {{ displaySize().y }}</span>
    </span>
    <div class="atmos-collage__size-blocks" (mouseleave)="previewCollageSize()">
      @for (block of blocks; track block.index) {
        <button type="button" class="atmos-collage__size-block"
          [class.is-active]="isInCollage(block.index)"
          [class.is-preview]="isInDisplaySize(block.index)"
          [attr.aria-label]="(block.col + 1) + ' by ' + (block.row + 1)"
          [attr.aria-pressed]="collageSize().x === block.col + 1 && collageSize().y === block.row + 1"
          (mouseenter)="previewCollageSize(block)"
          (focus)="previewCollageSize(block)"
          (blur)="previewCollageSize()"
          (click)="setCollageSize(block)">
        </button>
      }
    </div>
  </div>

  <!-- Toolbar -->
  <div class="atmos-collage__toolbar">
    <button type="button" class="atmos-btn atmos-btn--sm" (click)="saveCollage()">
      <mat-icon class="atmos-icon--18">save</mat-icon>
      Save
    </button>

    <button
      type="button"
      class="atmos-btn atmos-btn--sm"
      (click)="copyCollage(ttCopy)"
      [disabled]="isRendering()"
      skyTooltip="Copied!"
      #ttCopy="skyTooltip"
      manual
      placement="top"
      [closeDelay]="1000"
    >
      <mat-icon class="atmos-icon--18" [class.spin]="isRendering()">
        {{ isRendering() ? 'cached' : 'image' }}
      </mat-icon>
      Copy
    </button>

    <button type="button" class="atmos-btn atmos-btn--sm atmos-btn--danger" (click)="reset()">
      <mat-icon class="atmos-icon--18">delete_forever</mat-icon>
      Reset
    </button>
  </div>

  <!-- Slot grid -->
  <div class="atmos-collage__scroll atmos-scroll-x">
    <div class="atmos-collage__grid">
      @for (block of blocks; track block.index) {
        <app-collage-slot
          class="app-collage-slot"
          [class.is-outside]="!isInCollage(block.index)"
          [attr.data-slot-index]="block.index"
          [slotIndex]="block.index"
          (imageChanged)="onSlotImageChanged($event)"
          (iconChanged)="onSlotIconChanged($event)"
          (pasteRequested)="onSlotPasteRequested($event)"
          (pasteClosed)="onSlotPasteClosed()"
        />
      }
    </div>
  </div>

</div>
