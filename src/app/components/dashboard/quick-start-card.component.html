@if (isVisible()) {
  <section class="atmos-card atmos-quick-start" aria-label="Quick start">
    <div class="atmos-quick-start__icon"><mat-icon>auto_awesome</mat-icon></div>
    <div class="atmos-quick-start__text">
      <h2 class="atmos-section__title">{{ 'NAV.DASHBOARD_QUICK_START_TITLE' | translate }}</h2>
      <p>{{ 'NAV.DASHBOARD_QUICK_START_DESC1' | translate }}</p>
      <p>{{ 'NAV.DASHBOARD_QUICK_START_DESC2' | translate }}</p>
    </div>
    <div class="atmos-quick-start__actions">
      <button type="button" class="atmos-btn atmos-btn--sm" (click)="dismiss()">{{ 'NAV.DASHBOARD_QUICK_START_DISMISS' | translate }}</button>
      <a class="atmos-btn atmos-btn--active" routerLink="/quick-start">{{ 'NAV.DASHBOARD_QUICK_START_SETUP' | translate }} <mat-icon>arrow_forward</mat-icon></a>
    </div>
  </section>
}
