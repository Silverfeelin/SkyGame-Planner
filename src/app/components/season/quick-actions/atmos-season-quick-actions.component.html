<atmos-quick-actions>
  <a class="atmos-btn atmos-btn--sm" routerLinkActive="atmos-btn--active" [routerLinkActiveOptions]="{ exact: true }" routerLink="/season"><mat-icon>ac_unit</mat-icon> Seasons</a>
  @if (hasTiers()) {
    <a class="atmos-btn atmos-btn--sm" routerLinkActive="atmos-btn--active" routerLink="/season/optimizer"><mat-icon>calculate</mat-icon> Season optimizer</a>
  } @else {
    <a class="atmos-btn atmos-btn--sm" routerLinkActive="atmos-btn--active" routerLink="/season/calculator"><mat-icon>calculate</mat-icon> Season calculator</a>
  }
  <a class="atmos-btn atmos-btn--sm" [href]="wikiHref() || 'https://sky-children-of-the-light.fandom.com/wiki/Seasonal_Events'" target="_blank" rel="noopener"><mat-icon>open_in_new</mat-icon> Wiki</a>
  <a class="atmos-btn atmos-btn--sm" [href]="calendarHref() || 'https://skydreamers.notion.site/Sky-Event-Calendar-FM-ec6e6134924048859b2a8410b0a8b20d'" target="_blank" rel="noopener"><mat-icon>open_in_new</mat-icon> Sky Event Calendar | FM</a>
  <ng-content></ng-content>
</atmos-quick-actions>
