<app-section-quick-actions section="shop" />

<header class="atmos-page__header">
  <h1 class="atmos-page__title">Prairie Heights</h1>
  <div class="atmos-page__header-actions">
    <a class="atmos-btn atmos-btn--sm" href="https://sky-children-of-the-light.fandom.com/wiki/Prairie_Heights" target="_blank" rel="noopener">
      <mat-icon>open_in_new</mat-icon>
      <span>Wiki</span>
    </a>
  </div>
</header>

@if (igcShops.length) {
  <section class="atmos-card atmos-shop-prairie-heights__section">
    <header class="atmos-shop-prairie-heights__section-header">
      <h2 class="atmos-section__title">In-game currency</h2>
    </header>
    <div class="atmos-card__body atmos-shop-prairie-heights__section-body">
      <app-shop-item-lists [shops]="igcShops" [highlightNode]="highlightNode()" />
    </div>
  </section>
}
