<header class="atmos-page__header">
  <h1 class="atmos-page__title">Realms</h1>
</header>

<div class="atmos-page__quick-actions">
  <a class="atmos-btn atmos-btn--sm" href="https://sky-children-of-the-light.fandom.com/wiki/Realms" target="_blank" rel="noopener">
    <mat-icon>open_in_new</mat-icon>
    <span>Wiki</span>
  </a>
  <a class="atmos-btn atmos-btn--sm" routerLink="/r/area">
    <mat-icon>location_on</mat-icon>
    <span>Areas</span>
  </a>
  <a class="atmos-btn atmos-btn--sm" routerLink="/r/realm/shared-creations">
    <mat-icon>place</mat-icon>
    <span>Shared Creations</span>
  </a>
  <a class="atmos-btn atmos-btn--sm" routerLink="/r/realm/cr-tracker">
    <mat-icon>candle</mat-icon>
    <span>Candle Run Tracker</span>
  </a>
  <a class="atmos-btn atmos-btn--sm" routerLink="/r/realm/pnr-tracker">
    <mat-icon>arrow_forward</mat-icon>
    <span>Eden Statue Tracker</span>
  </a>
  <button type="button" class="atmos-btn atmos-btn--sm"
    [class.atmos-btn-active]="showMap()" (click)="toggleShowMap()">
    <mat-icon>map</mat-icon>
    <span>{{ showMap() ? 'Hide map' : 'Show map' }}</span>
  </button>
</div>

<section class="atmos-card atmos-realms__map" [class.is-hidden]="!showMap()">
  <div class="atmos-realms__map-container" #mapContainer>
    <div class="atmos-realms__map-controls">
      <button type="button"
        class="atmos-btn atmos-btn--sm"
        [class.atmos-btn-active]="showAreas()"
        [ngbTooltip]="'Show areas'" container="body" placement="bottom-start"
        (click)="toggleShowAreas()">
        <mat-icon>location_on</mat-icon>
      </button>
      <button type="button"
        class="atmos-btn atmos-btn--sm"
        [class.atmos-btn-active]="showMapShrines()"
        [ngbTooltip]="'Show map shrines'" container="body" placement="bottom-start"
        (click)="toggleShowMapShrines()">
        <mat-icon svgIcon="map-shrine"></mat-icon>
      </button>
      <button type="button"
        class="atmos-btn atmos-btn--sm"
        [class.atmos-btn-active]="showWingedLight()"
        [ngbTooltip]="'Show winged light'" container="body" placement="bottom-start"
        (click)="toggleShowWingedLight()">
        <mat-icon svgIcon="flaps"></mat-icon>
      </button>
    </div>
    <div class="map"></div>
  </div>
</section>

<section class="atmos-realms__grid">
  @for (realm of visibleRealms; track realm.guid) {
    <article class="atmos-card atmos-realms__card">
      @if (realm.imageUrl) {
        <div class="atmos-realms__card-img"
          [style.background-image]="'url(' + realm.imageUrl + ')'"
          [style.background-position]="realm.imagePosition || null"></div>
      }
      <div class="atmos-card__body atmos-realms__card-body">
        <h2 class="atmos-realms__card-title">{{ realm.name }}</h2>
        <div class="atmos-realms__card-links">
          <a class="atmos-btn atmos-btn--sm" [routerLink]="['/r/realm', realm.guid]">
            <mat-icon>article</mat-icon>
            <span>Overview</span>
          </a>
          @if (realm.areas?.length) {
            <a class="atmos-btn atmos-btn--sm" routerLink="/r/area" [queryParams]="{ realm: realm.guid }">
              <mat-icon>location_on</mat-icon>
              <span>Areas</span>
            </a>
          }
        </div>
      </div>
    </article>
  }
</section>
