<header class="atmos-page__header">
  <h1 class="atmos-page__title">Cinema</h1>
</header>

<div class="atmos-page__quick-actions">
  <a class="atmos-btn atmos-btn--sm" routerLink="/r/shop">
    <mat-icon>arrow_back</mat-icon>
    <span>Shops</span>
  </a>
  <a class="atmos-btn atmos-btn--sm"
     href="https://sky-children-of-the-light.fandom.com/wiki/Collaboration_Room"
     target="_blank" rel="noopener">
    <mat-icon>open_in_new</mat-icon>
    <span>Wiki</span>
  </a>
</div>

@if (iapShops.length) {
  <section class="atmos-card atmos-shop-cinema__section">
    <header class="atmos-shop-cinema__section-header">
      <h2 class="atmos-shop-cinema__section-title">In-app purchases</h2>
    </header>
    <div class="atmos-card__body atmos-shop-cinema__section-body">
      <div class="atmos-shop-cinema__iap-grid">
        @for (shop of iapShops; track shop.guid) {
          @for (iap of shop.iaps; track iap.guid) {
            <app-atmos-iap-card
              [iap]="iap"
              [highlightIap]="highlightIap()"
              (purchasedToggle)="togglePurchased(iap)"
              (giftedToggle)="toggleGifted(iap)"></app-atmos-iap-card>
          }
        }
      </div>
    </div>
  </section>
}
