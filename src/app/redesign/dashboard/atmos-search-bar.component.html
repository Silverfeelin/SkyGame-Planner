<div class="atmos-search">
  <div class="atmos-search__input atmos-focus-ring">
    <mat-icon>search</mat-icon>
    <input
      type="search"
      placeholder="Where to in Sky today?" />
  </div>
  <a class="atmos-btn atmos-search__favourite" routerLink="/r/item">
    <mat-icon>new_releases</mat-icon>
    <span>Favourite items</span>
    <span class="atmos-search__count">{{ favouriteCount() }}</span>
  </a>
</div>
