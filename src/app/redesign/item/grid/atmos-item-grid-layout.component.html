<section class="atmos-card atmos-item-grid__card">
  <div class="atmos-item-grid__rail-wrap">
  <nav class="atmos-item-grid__rail">
    <div class="atmos-item-grid__rail-label">Category</div>
    @for (c of visibleCategories(); track c.type) {
      <button class="atmos-item-grid__rail-item atmos-focus-ring"
              [class.is-active]="active() === c.type"
              (click)="active.set(c.type)">
        <mat-icon class="atmos-item-grid__rail-icon" [svgIcon]="c.svgIcon"></mat-icon>
        <span class="atmos-item-grid__rail-name">{{ c.type | itemType:true }}</span>
        <span class="atmos-item-grid__rail-count">{{ categoryCounts().get(c.type)?.unlocked }}/{{ categoryCounts().get(c.type)?.total }}</span>
      </button>
    }
  </nav>
  </div>

  <div class="atmos-item-grid__column">
    <atmos-item-type-nav [entries]="visibleCategories()" [active]="active()"
                         (typeSelected)="active.set($event)"/>

    <div class="atmos-item-grid__card-header">
      <div class="atmos-item-grid__card-title">
        <mat-icon [svgIcon]="activeCategory().svgIcon"></mat-icon>
        <h2>{{ activeCategory().type | itemType:true }}</h2>
      </div>
      <div class="atmos-item-grid__count">
        <strong>{{ activeUnlocked() }}</strong>
        <span> / {{ activeItems().length }}</span>
        <span> unlocked</span>
      </div>
    </div>

    <div class="atmos-item-grid__items">
      @for (item of activeItems(); track item.guid) {
        <ng-container [ngTemplateOutlet]="itemTemplate()"
                      [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>
      }
    </div>
  </div>
</section>
